<!doctype html>
<!-- Source for images/og.jpg. Open at 1200x630 and screenshot to regenerate. Not deployed. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  .og { display: grid; grid-template-columns: 1fr 470px; width: 1200px; height: 630px; background: var(--bg); }
  .og__copy { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 26px; padding: 0 40px 0 72px; }
  .og__brand { font-weight: 700; font-size: 20px; letter-spacing: 0.2em; color: var(--ink); }
  .og__title { font-family: var(--font-serif); font-weight: 600; font-size: 78px; line-height: 0.98; letter-spacing: -0.03em; color: var(--ink); }
  .og__title em { font-style: italic; font-weight: 500; color: var(--orange); }
  .og__row { display: flex; gap: 14px; align-items: center; }
  .og__pill { padding: 14px 24px; border-radius: 999px; background: var(--orange); color: #fff; font-weight: 700; font-size: 24px; }
  .og__pill--ghost { background: transparent; border: 2px solid var(--border); color: var(--ink); }
  .og__photo { position: relative; padding: 36px 36px 36px 0; }
  .og__photo img { width: 100%; height: 100%; object-fit: cover; object-position: center 22%; border-radius: 28px; }
</style>
</head>
<body>
  <div class="og">
    <div class="og__copy">
      <div class="og__brand">NAKED TRAINING</div>
      <div class="og__title">Finish the year<br><em>stronger</em> than<br>you started it.</div>
      <div class="og__row">
        <div class="og__pill">8-Week Challenge with Brooke Ence</div>
      </div>
      <div class="og__row">
        <div class="og__pill og__pill--ghost">Starts October 5</div>
        <div class="og__pill og__pill--ghost">5 winners, $2,000 each</div>
      </div>
    </div>
    <div class="og__photo"><img src="../images/hero.jpg" alt=""></div>
  </div>
</body>
</html>
