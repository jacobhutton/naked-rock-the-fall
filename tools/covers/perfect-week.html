<!doctype html>
<!-- Perfect Week Workbook cover. The PDF's first page is a 16:9 purple slide, so this portrait
     cover is a redesign in the style of the other guides. Rendered by tools/covers.sh. Photo: DSC01169. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="cover.css">
  <style>
    /* Scaled from the top-right corner so Brooke sits left of the title instead of behind it */
    .photo { object-position: 50% 20%; transform: scale(1.28); transform-origin: 100% 18%; }
    .title { font-size: 190px; }
    .text { left: auto; right: 80px; text-align: right; }
    .byline { margin-left: 0; margin-right: 6px; }
  </style>
</head>
<body>
  <div class="cover">
    <img class="photo" src="../../images/originals/guides/DSC01169.jpg" alt="">
    <div class="scrim"></div>
    <div class="wordmark"></div>
    <div class="text">
      <h1 class="title">Perfect<br>Week<br>Workbook</h1>
      <p class="byline">With Brooke Ence</p>
    </div>
  </div>
</body>
</html>
